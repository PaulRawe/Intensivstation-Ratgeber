name: Sitemap erzeugen

# Baut sitemap.xml aus dem tatsaechlichen Dateibestand.
# Sprachverknuepfungen werden aus den hreflang-Angaben im Kopf jeder
# Seite uebernommen, die dort bereits stehen.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # montags, falls laenger nichts committet wurde

jobs:
  sitemap:
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'Sitemap automatisch')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # noetig fuer das Datum der letzten Aenderung

      - name: sitemap.xml bauen
        run: |
          python3 << 'PYEOF'
          import os, re, subprocess, datetime

          BASIS = 'https://intensivstation-ratgeber.de'

          AUS_NAMEN = {'404.html', 'sitemap.html'}
          AUS_ORDNER = ('./.github', './includes', './preview', './node_modules', './scripts')

          def ueberspringen(pfad, name):
              if name in AUS_NAMEN: return True
              if name.lower().startswith('google'): return True
              if any(pfad.startswith(o) for o in AUS_ORDNER): return True
              if '/includes/' in pfad or '/preview/' in pfad: return True
              return False

          def adresse(pfad):
              rel = pfad.replace('\\', '/').lstrip('./')
              if rel.endswith('/index.html'):
                  rel = rel[:-len('index.html')]
              elif rel == 'index.html':
                  rel = ''
              return BASIS + '/' + rel

          def geaendert(pfad):
              try:
                  d = subprocess.run(['git', 'log', '-1', '--format=%cs', '--', pfad],
                                     capture_output=True, text=True, timeout=20).stdout.strip()
                  if re.match(r'^\d{4}-\d{2}-\d{2}$', d): return d
              except Exception:
                  pass
              return datetime.date.today().isoformat()

          def gewicht(rel):
              if rel in ('', 'index.html'): return '1.0'
              if rel.rstrip('/') in ('pl', 'ru', 'tr'): return '0.9'
              if re.match(r'^(bibliothek|pl/biblioteka|ru/biblioteka|tr/kutuphane)/', rel + '/'): return '0.9'
              if '/' not in rel.rstrip('/'): return '0.8'
              return '0.6'

          eintraege = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules', '.github')]
              for fn in sorted(files):
                  if not fn.endswith('.html'): continue
                  pfad = os.path.join(root, fn)
                  if ueberspringen(pfad.replace('\\', '/'), fn): continue
                  try:
                      html = open(pfad, encoding='utf-8', errors='replace').read()
                  except Exception:
                      continue
                  # Fragmente ohne eigenes Dokument gehoeren nicht in die Sitemap
                  if '<html' not in html.lower() or '<title' not in html.lower():
                      continue
                  if re.search(r'<meta[^>]+name="robots"[^>]+noindex', html, re.I):
                      continue

                  m = re.search(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"', html, re.I)
                  loc = m.group(1) if m else adresse(pfad)

                  alt = re.findall(r'<link[^>]+rel="alternate"[^>]+hreflang="([^"]+)"[^>]+href="([^"]+)"', html, re.I)
                  rel = pfad.replace('\\', '/').lstrip('./')
                  eintraege.append((loc, geaendert(pfad), gewicht(rel), alt))

          # Doppelte Adressen zusammenfassen
          gesehen, sauber = set(), []
          for loc, mod, prio, alt in sorted(eintraege):
              if loc in gesehen: continue
              gesehen.add(loc); sauber.append((loc, mod, prio, alt))

          zeilen = ['<?xml version="1.0" encoding="UTF-8"?>',
                    '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"',
                    '        xmlns:xhtml="http://www.w3.org/1999/xhtml">']
          for loc, mod, prio, alt in sauber:
              zeilen.append('  <url>')
              zeilen.append('    <loc>%s</loc>' % loc)
              for sprache, ziel in alt:
                  zeilen.append('    <xhtml:link rel="alternate" hreflang="%s" href="%s"/>' % (sprache, ziel))
              zeilen.append('    <lastmod>%s</lastmod>' % mod)
              zeilen.append('    <priority>%s</priority>' % prio)
              zeilen.append('  </url>')
          zeilen.append('</urlset>')

          open('sitemap.xml', 'w', encoding='utf-8').write('\n'.join(zeilen) + '\n')
          mit_alt = sum(1 for e in sauber if e[3])
          print('%d Adressen, davon %d mit Sprachverknuepfung' % (len(sauber), mit_alt))
          PYEOF

      - name: Commit & Push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add sitemap.xml
          git diff --staged --quiet && echo "Sitemap unverändert." || (
            git commit -m "Sitemap automatisch erzeugt" &&
            git pull --rebase origin main &&
            git push
          )
